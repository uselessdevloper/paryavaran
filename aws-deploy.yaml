AWSTemplateFormatVersion: '2010-09-09'
Resources:
  ParyavaranInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.medium
      ImageId: resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1
          echo "--- Starting Paryavaran Deployment ---"
          yum update -y
          yum install -y git python3 python3-pip
          git clone https://github.com/uselessdevloper/paryavaran.git /home/ec2-user/paryavaran
          cd /home/ec2-user/paryavaran
          python3 -m pip install -r requirements-web.txt --ignore-installed

          cat << 'EOF' > /etc/systemd/system/paryavaran.service
          [Unit]
          Description=Paryavaran Dash Application
          After=network.target

          [Service]
          User=root
          WorkingDirectory=/home/ec2-user/paryavaran/Plotly_Dash_App
          ExecStart=/usr/bin/python3 -m gunicorn app:server -b 0.0.0.0:80 --workers 2 --timeout 120
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable paryavaran
          systemctl start paryavaran
          echo "--- Paryavaran Service Started Successfully ---"
  
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
Outputs:
  WebsiteURL:
    Description: URL of the Paryavaran Dashboard
    Value: !Join ['', ['http://', !GetAtt ParyavaranInstance.PublicDnsName]]
